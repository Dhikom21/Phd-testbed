apiVersion: v1
kind: Namespace
metadata:
  name: agent-sandbox
  labels:
    purpose: agent-experiments
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-agent
  namespace: agent-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: agent-sandbox
  name: agent-operator
rules:
  - apiGroups: ["", "apps"]
    resources: ["deployments", "pods", "services", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-agent-binding
  namespace: agent-sandbox
subjects:
  - kind: ServiceAccount
    name: openclaw-agent
    namespace: agent-sandbox
roleRef:
  kind: Role
  name: agent-operator
  apiGroup: rbac.authorization.k8s.io
